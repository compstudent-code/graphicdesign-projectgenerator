<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Virtual Design Server</title>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/8417/8417052.png">
  <style>
    :root{
      --bg:#0b1220; --panel:#0f1a2e; --panel2:#0c1526; --text:#e8eefc; --muted:#98a7c6;
      --accent:#6d7cff; --accent2:#22c55e; --danger:#ef4444; --line:#1f2a44;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius:18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .light{
      --bg:#f5f7ff; --panel:#ffffff; --panel2:#f1f4ff; --text:#0b1220; --muted:#4b5a7a;
      --accent:#4f46e5; --accent2:#16a34a; --danger:#dc2626; --line:#e3e7f5;
      --shadow: 0 16px 50px rgba(18,24,40,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:var(--sans);
      background: radial-gradient(1200px 800px at 20% 0%, rgba(109,124,255,.22), transparent 60%),
                  radial-gradient(900px 700px at 90% 30%, rgba(34,197,94,.12), transparent 55%),
                  var(--bg);
      color:var(--text);
      min-height:100vh;
      padding:24px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
    }
    .app{
      width:min(1100px, 100%);
      background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 40%), var(--panel);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 18px 12px;
      border-bottom:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);
      gap:12px;
    }
    .brand{
      display:flex; flex-direction:column; gap:2px;
    }
    .brand h1{
      margin:0; font-size:16px; letter-spacing:.2px;
    }
    .brand .sub{
      color:var(--muted); font-size:12px;
    }
    .top-actions{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    .chip{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
      padding:6px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.02);
    }
    .btn{
      border:none; cursor:pointer;
      padding:10px 12px;
      border-radius:12px;
      font-weight:650;
      color:white;
      background:var(--accent);
      transition:transform .05s ease, filter .15s ease;
      display:inline-flex; align-items:center; gap:8px;
      box-shadow:0 10px 24px rgba(109,124,255,.22);
    }
    .btn:active{ transform: translateY(1px) }
    .btn.secondary{
      background:transparent;
      color:var(--text);
      border:1px solid var(--line);
      box-shadow:none;
    }
    .btn.good{ background:var(--accent2); box-shadow:0 10px 24px rgba(34,197,94,.18); }
    .btn.danger{ background:var(--danger); box-shadow:0 10px 24px rgba(239,68,68,.18); }
    .btn.small{ padding:8px 10px; border-radius:10px; font-size:13px; }
    .tabs{
      display:flex;
      gap:8px;
      padding:12px 18px 14px;
      border-bottom:1px solid var(--line);
      background: var(--panel2);
      flex-wrap:wrap;
    }
    .tab{
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.02);
      color:var(--muted);
      cursor:pointer;
      user-select:none;
      font-weight:650;
      font-size:13px;
      display:flex; align-items:center; gap:10px;
    }
    .tab.active{
      color:var(--text);
      border-color:rgba(109,124,255,.55);
      background:rgba(109,124,255,.12);
    }
    .badge{
      font-size:12px;
      padding:3px 8px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      color:var(--muted);
      font-family:var(--mono);
    }

    main{ padding:18px; }
    .grid{
      display:grid;
      grid-template-columns: 360px 1fr;
      gap:14px;
    }
    @media (max-width: 900px){
      .grid{ grid-template-columns: 1fr; }
    }
    .panel{
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.02);
      overflow:hidden;
    }
    .panel .head{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 12px;
      border-bottom:1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
    }
    .panel .head .title{
      font-weight:750;
      font-size:13px;
      color:var(--text);
      display:flex; align-items:center; gap:10px;
    }
    .panel .head .title span{
      color:var(--muted);
      font-weight:650;
      font-family:var(--mono);
      font-size:12px;
    }
    .list{ max-height: 520px; overflow:auto; }
    .item{
      padding:12px;
      border-bottom:1px solid var(--line);
      cursor:pointer;
      display:flex;
      flex-direction:column;
      gap:6px;
      background: transparent;
    }
    .item:hover{ background:rgba(255,255,255,.03) }
    .item.selected{ background:rgba(109,124,255,.10) }
    .row{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .sender{
      font-family:var(--mono);
      font-size:13px;
      color:var(--text);
    }
    .meta{ color:var(--muted); font-size:12px; }
    .pill{
      font-size:12px;
      font-family:var(--mono);
      padding:3px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      color:var(--muted);
      background:rgba(255,255,255,.02);
      white-space:nowrap;
    }
    .details{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-height: 420px;
    }
    .kv{
      display:grid;
      grid-template-columns: 140px 1fr;
      gap:8px 12px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:14px;
      background: rgba(0,0,0,.08);
    }
    .k{ color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .v{ font-size:14px; line-height:1.45; }
    .v.mono{ font-family:var(--mono); }
    .actions{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .hint{
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    input, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      outline:none;
    }
    textarea{ min-height: 120px; resize: vertical; }
    .link{
      color: var(--text);
      text-decoration:none;
      border-bottom:1px dashed rgba(109,124,255,.6);
    }
    .link:hover{ color: var(--accent) }

    /* Calendar */
    .calendar{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .cal-head{
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
      padding:12px;
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(255,255,255,.02);
    }
    .cal-head .month{
      font-weight:800;
      letter-spacing:.2px;
    }
    .cal-grid{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:8px;
    }
    .dow{
      text-align:center;
      font-size:12px;
      color:var(--muted);
      font-family:var(--mono);
      padding:6px 0;
    }
    .day{
      border:1px solid var(--line);
      border-radius:14px;
      min-height: 90px;
      padding:10px;
      background:rgba(255,255,255,.02);
      cursor:pointer;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .day.muted{ opacity:.45; }
    .day:hover{ background:rgba(255,255,255,.04); }
    .daynum{
      font-family:var(--mono);
      font-size:12px;
      color:var(--muted);
      display:flex; justify-content:space-between; align-items:center;
    }
    .marks{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .mark{
      font-size:12px;
      padding:6px 8px;
      border-radius:12px;
      border:1px solid var(--line);
      background: rgba(109,124,255,.10);
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }
    .drawer{
      margin-top:12px;
      border:1px solid var(--line);
      border-radius:16px;
      background: rgba(255,255,255,.02);
      padding:12px;
    }
    .drawer h3{
      margin:0 0 10px 0;
      font-size:13px;
      color:var(--muted);
      font-family:var(--mono);
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .drawer .p{
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      background: rgba(0,0,0,.08);
      margin-bottom:10px;
    }
    .toast{
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.78);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .toast.show{ opacity: 1; }
    
    /* Markdown converted HTML styling */
    #responseHtmlDisplay h1,
    #responseHtmlDisplay h2,
    #responseHtmlDisplay h3,
    #responseHtmlDisplay h4,
    #responseHtmlDisplay h5,
    #responseHtmlDisplay h6 {
      margin: 16px 0 8px 0;
      color: var(--text);
      line-height: 1.3;
    }
    #responseHtmlDisplay h1 { font-size: 24px; font-weight: 750; }
    #responseHtmlDisplay h2 { font-size: 20px; font-weight: 700; }
    #responseHtmlDisplay h3 { font-size: 17px; font-weight: 700; }
    #responseHtmlDisplay h4,
    #responseHtmlDisplay h5,
    #responseHtmlDisplay h6 { font-size: 15px; font-weight: 650; }
    
    #responseHtmlDisplay p { margin: 10px 0; line-height: 1.6; color: var(--text); }
    
    #responseHtmlDisplay ul,
    #responseHtmlDisplay ol {
      margin: 10px 0 10px 20px;
      color: var(--text);
    }
    #responseHtmlDisplay li { margin: 6px 0; line-height: 1.5; }
    
    #responseHtmlDisplay code {
      font-family: var(--mono);
      background: rgba(109,124,255,.12);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
    }
    
    #responseHtmlDisplay pre {
      background: rgba(0,0,0,.2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      overflow-x: auto;
    }
    
    #responseHtmlDisplay pre code {
      background: none;
      color: var(--text);
      padding: 0;
      border-radius: 0;
      font-size: 12px;
    }
    
    #responseHtmlDisplay blockquote {
      border-left: 3px solid var(--accent);
      margin: 10px 0;
      padding-left: 12px;
      color: var(--muted);
      font-style: italic;
    }
    
    #responseHtmlDisplay a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dashed rgba(109,124,255,.6);
    }
    
    #responseHtmlDisplay a:hover {
      color: var(--accent2);
    }
    
    #responseHtmlDisplay hr {
      border: none;
      border-top: 1px solid var(--line);
      margin: 16px 0;
    }
    
    #responseHtmlDisplay table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
    }
    
    #responseHtmlDisplay table th,
    #responseHtmlDisplay table td {
      border: 1px solid var(--line);
      padding: 8px 12px;
      text-align: left;
    }
    
    #responseHtmlDisplay table th {
      background: rgba(109,124,255,.12);
      font-weight: 650;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="brand">
        <h1>Virtual Design Server</h1>
        <div class="sub">A local, frontend-only simulation of incoming design requests → projects → deadlines.</div>
      </div>
      <div class="top-actions">
        <div class="chip" id="chipStatus">Syncing…</div>
        <button class="btn secondary small" id="themeBtn" title="Toggle theme">🌗 Theme</button>
        <button class="btn secondary small" id="resetBtn" title="Clear all local data">🧹 Reset</button>
      </div>
    </header>

    <div class="tabs">
      <div class="tab active" data-tab="requests">Requests <span class="badge" id="reqBadge">0</span></div>
      <div class="tab" data-tab="projects">Projects <span class="badge" id="projBadge">0</span></div>
      <div class="tab" data-tab="calendar">Calendar</div>
    </div>

    <main id="main"></main>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
/* =========================
   Virtual Design Server
   Frontend-only, localStorage-based
   ========================= */

/* ---- Storage schema ----
state = {
  version: 1,
  lastRequestTick: number (ms), // last time we advanced request generation tick
  requests: [{ id, sender, mediaType, mediaKey, deadlineAt, receivedAt, status: 'pending'|'accepted'|'rejected', decidedAt?, projectId? }],
  projects: [{ id, requestId, sender, mediaType, mediaKey, dueAt, createdAt, status: 'awaiting_details'|'active'|'done', copilotPrompt?, promptCopiedAt?, copilotChatUrl?, notes? }],
  ui: { theme: 'dark'|'light' }
}
*/

const STORAGE_KEY = "vds_state_v1";
const REQUEST_INTERVAL_MS = 2 * 24 * 60 * 60 * 1000; // 2 days

/* ---------- helpers ---------- */
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function fmtDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleString(undefined, { year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
}
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function uid(){
  return (crypto?.randomUUID?.() ?? ("id_" + Math.random().toString(16).slice(2) + Date.now().toString(16)));
}
function daysFromNow(minDays, maxDays){
  const days = randInt(minDays, maxDays);
  return Date.now() + days * 24*60*60*1000;
}

/* ---------- Prompt template for Copilot details ---------- */
function buildCopilotPrompt(project){
  // Focus: generate a detailed brief and specs from the request meta.
  return [
`You are a creative director writing a detailed graphic design brief.`,
`I accepted a new request with these basics:`,
`- Sender/Client handle: ${project.sender}`,
`- Media type: ${project.mediaType}`,
`- Deadline (due date): ${fmtDate(project.dueAt)}`,
``,
`Please generate a full project brief with the following sections:`,
`1) Project title (short, specific)`,
`2) Client/business description (industry, size, vibe)`,
`3) Content (project details, subject matter, any copy or text to include)`,
`4) Objective (what success looks like)`,
`5) Target audience (demographics + mindset)`,
`6) Key message + supporting points`,
`7) Deliverables list (exact outputs)`,
`8) Technical specs (dimensions, file formats, color mode, bleed, safe zones, accessibility notes)`,
`9) Visual direction (tone, style references described in words, typography guidance, color approach)`,
``,
`Keep it realistic and actionable. Use bullet points where helpful.`,
`End with a concise checklist of what to produce.`
  ].join("\n");
}

/* ---------- load / save ---------- */
function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const st = JSON.parse(raw);
      // minimal migration guard
      if(!st.version) st.version = 1;
      st.requests ||= [];
      st.projects ||= [];
      st.ui ||= { theme: "dark" };
      return st;
    }catch(e){
      console.warn("Bad state, resetting", e);
    }
  }
  // first-run init: create one initial request now
  const now = Date.now();
  const init = {
    version: 1,
    lastRequestTick: now,
    requests: [],
    projects: [],
    ui: { theme: "dark" }
  };
  // add 1 request immediately for a “live server” feel
  init.requests.push(generateRequest(now));
  saveState(init);
  return init;
}
function saveState(st){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
}

/* ---------- request generation logic ---------- */
function randomSender(){
  const w1 = senderWords[randInt(0, senderWords.length-1)];
  let w2 = senderWords[randInt(0, senderWords.length-1)];
  if(w2 === w1) w2 = senderWords[(senderWords.indexOf(w2)+7) % senderWords.length];
  return `${w1}_${w2}`;
}
function pickMedia(){
  return mediaCatalog[randInt(0, mediaCatalog.length-1)];
}
function generateRequest(receivedAt){
  const media = pickMedia();
  const deadlineAt = daysFromNow(media.minDays, media.maxDays);
  return {
    id: uid(),
    sender: randomSender(),
    mediaKey: media.key,
    mediaType: media.name,
    deadlineAt,
    receivedAt,
    status: "pending"
  };
}

function syncIncomingRequests(state){
  const now = Date.now();
  const last = state.lastRequestTick ?? now;
  const diff = now - last;
  const n = diff > 0 ? Math.floor(diff / REQUEST_INTERVAL_MS) : 0;

  if(n > 0){
    for(let i=0;i<n;i++){
      const receivedAt = last + (i+1)*REQUEST_INTERVAL_MS;
      state.requests.push(generateRequest(receivedAt));
    }
    state.lastRequestTick = last + n*REQUEST_INTERVAL_MS;
    saveState(state);
    return n;
  }
  return 0;
}

/* ---------- clipboard helper (with fallback) ---------- */
async function copyToClipboard(text){
  // Try modern clipboard API first
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){ /* fall back */ }

  // Fallback using execCommand
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.style.top = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){
    return false;
  }
}

/* ---------- core actions ---------- */
function acceptRequest(reqId){
  const req = state.requests.find(r => r.id === reqId);
  if(!req || req.status !== "pending") return;

  req.status = "accepted";
  req.decidedAt = Date.now();

  const proj = {
    id: uid(),
    requestId: req.id,
    sender: req.sender,
    mediaKey: req.mediaKey,
    mediaType: req.mediaType,
    dueAt: req.deadlineAt,
    createdAt: Date.now(),
    status: "awaiting_details",
    copilotPrompt: "",
    promptCopiedAt: null,
    copilotChatUrl: "",
    notes: "",
    responseMarkdown: "",
    responseHtml: "",
    detailsStep: "awaiting_prompt_action"  // awaiting_prompt_action -> awaiting_response_paste -> done
  };
  state.projects.push(proj);
  req.projectId = proj.id;

  saveState(state);
  selectedProjectId = proj.id;
  toast("Accepted → moved to Projects");
  currentTab = "projects";
  $$(".tab").forEach(x => x.classList.toggle("active", x.dataset.tab === currentTab));
  render();
}

function rejectRequest(reqId){
  const req = state.requests.find(r => r.id === reqId);
  if(!req || req.status !== "pending") return;
  req.status = "rejected";
  req.decidedAt = Date.now();
  saveState(state);
  toast("Rejected request");
  // keep selection sane
  if(selectedRequestId === reqId) selectedRequestId = null;
  render();
}

async function copyProjectPrompt(projId){
  const proj = state.projects.find(p => p.id === projId);
  if(!proj) return;
  const prompt = buildCopilotPrompt(proj);
  const ok = await copyToClipboard(prompt);
  if(ok){
    proj.copilotPrompt = prompt;
    proj.promptCopiedAt = Date.now();
    proj.detailsStep = "awaiting_response_paste";
    saveState(state);
    toast("Prompt copied. Opening Copilot...");
    // Open Copilot in a new tab
    window.open("https://copilot.microsoft.com", "_blank");
    render();
  }else{
    toast("Copy failed (browser restriction). Try HTTPS/localhost.");
  }
}

function saveProjectLink(projId, url){
  const proj = state.projects.find(p => p.id === projId);
  if(!proj) return;
  proj.copilotChatUrl = (url || "").trim();
  if(proj.copilotChatUrl) proj.status = "active";
  saveState(state);
  toast("Saved Copilot chat link.");
  render();
}

function saveProjectNotes(projId, notes){
  const proj = state.projects.find(p => p.id === projId);
  if(!proj) return;
  proj.notes = notes;
  saveState(state);
  toast("Notes saved.");
}

function saveProjectResponse(projId, markdown){
  const proj = state.projects.find(p => p.id === projId);
  if(!proj) return;
  proj.responseMarkdown = markdown;
  // Convert markdown to HTML using marked library
  proj.responseHtml = marked.parse(markdown);
  proj.detailsStep = "done";
  proj.status = "active";
  saveState(state);
  toast("Response saved and converted to HTML.");
}

/* ---------- rendering ---------- */
function updateBadges(){
  const pending = state.requests.filter(r => r.status === "pending").length;
  $("#reqBadge").textContent = pending;
  $("#projBadge").textContent = state.projects.length;
}

function setChip(text){
  $("#chipStatus").textContent = text;
}

function render(){
  updateBadges();

  // sync requests on every render entry (cheap)
  const newCount = syncIncomingRequests(state);
  if(newCount > 0){
    setChip(`+${newCount} new request${newCount>1?"s":""} received`);
  }else{
    const nextIn = REQUEST_INTERVAL_MS - (Date.now() - state.lastRequestTick);
    const hours = Math.ceil(clamp(nextIn, 0, REQUEST_INTERVAL_MS) / (60*60*1000));
    setChip(`Next request in ~${hours}h`);
  }

  // ensure selected IDs exist
  if(selectedRequestId && !state.requests.some(r => r.id === selectedRequestId)) selectedRequestId = null;
  if(selectedProjectId && !state.projects.some(p => p.id === selectedProjectId)) selectedProjectId = null;

  // default selection
  if(currentTab === "requests"){
    const pending = state.requests.filter(r => r.status === "pending").sort((a,b)=>b.receivedAt-a.receivedAt);
    if(!selectedRequestId && pending[0]) selectedRequestId = pending[0].id;
  }
  if(currentTab === "projects"){
    const list = state.projects.slice().sort((a,b)=>b.createdAt-a.createdAt);
    if(!selectedProjectId && list[0]) selectedProjectId = list[0].id;
  }

  const main = $("#main");
  main.innerHTML = "";

  if(currentTab === "requests") renderRequests(main);
  if(currentTab === "projects") renderProjects(main);
  if(currentTab === "calendar") renderCalendar(main);
}

  const pending = state.requests
    .filter(r => r.status === "pending")

  const acceptedRejectedCount = state.requests.filter(r => r.status !== "pending").length;

  root.innerHTML = `
    <div class="grid">
      <div class="panel">
        <div class="head">
          <div class="title">Inbox <span>${pending.length} pending</span></div>
          <div class="meta">Archived: ${acceptedRejectedCount}</div>
        </div>
        <div class="list" id="reqList"></div>
      </div>

      <div class="panel">
        <div class="head">
          <div class="title">Request Preview <span>select an item</span></div>
          <div class="meta"></div>
        </div>
        <div class="details" id="reqDetails"></div>
      </div>
    </div>
  `;

  const listEl = $("#reqList");
  listEl.innerHTML = pending.length ? "" : `
    <div style="padding:14px;color:var(--muted);">
      No pending requests right now. Check back later — the server drops a new request every 2 days.
    </div>
  `;

  pending.forEach(r => {
    const el = document.createElement("div");
    el.className = "item" + (r.id === selectedRequestId ? " selected" : "");
    el.innerHTML = `
      <div class="row">
        <div class="sender">${r.sender}</div>
        <div class="pill">due ${fmtDate(r.deadlineAt)}</div>
      </div>
      <div class="row">
        <div class="meta">${r.mediaType}</div>
        <div class="meta">received ${fmtDate(r.receivedAt)}</div>
      </div>
    `;
    el.addEventListener("click", () => {
      selectedRequestId = r.id;
      render();
    });
    listEl.appendChild(el);
  });

  renderRequestDetails();
}

function renderRequestDetails(){
  const detailsEl = $("#reqDetails");
  const r = state.requests.find(x => x.id === selectedRequestId && x.status === "pending");

  if(!r){
    detailsEl.innerHTML = `
      <div class="hint">
        Select a pending request to preview it. You can accept or reject it.
      </div>
    `;
    return;
  }

  detailsEl.innerHTML = `
    <div class="kv">
      <div class="k">Sender</div><div class="v mono">${r.sender}</div>
      <div class="k">Media</div><div class="v">${r.mediaType}</div>
      <div class="k">Received</div><div class="v">${fmtDateTime(r.receivedAt)}</div>
      <div class="k">Deadline</div><div class="v">${fmtDate(r.deadlineAt)}</div>
    </div>

    <div class="actions">
      <button class="btn good" id="acceptBtn">✅ Accept</button>
      <button class="btn danger" id="rejectBtn">✖ Reject</button>
    </div>

    <div class="hint">
      Accepting turns this request into a Project. Then you can generate a Copilot prompt to get full details.
    </div>
  `;

  $("#acceptBtn").addEventListener("click", () => acceptRequest(r.id));
  $("#rejectBtn").addEventListener("click", () => rejectRequest(r.id));
}

/* ---------- Projects tab ---------- */
function renderProjects(root){
  const projects = state.projects.slice().sort((a,b)=>b.createdAt-a.createdAt);

  root.innerHTML = `
    <div class="grid">
      <div class="panel">
        <div class="head">
          <div class="title">Current Projects <span>${projects.length}</span></div>
          <div class="meta">Click to view details</div>
        </div>
        <div class="list" id="projList"></div>
      </div>

      <div class="panel">
        <div class="head">
          <div class="title">Project Details <span>Copilot workflow</span></div>
          <div class="meta"></div>
        </div>
        <div class="details" id="projDetails"></div>
      </div>
    </div>
  `;

  const listEl = $("#projList");
  listEl.innerHTML = projects.length ? "" : `
    <div style="padding:14px;color:var(--muted);">
      No projects yet. Accept a request from the Requests tab.
    </div>
  `;

  projects.forEach(p => {
    const el = document.createElement("div");
    el.className = "item" + (p.id === selectedProjectId ? " selected" : "");
    el.innerHTML = `
      <div class="row">
        <div class="sender">${p.sender}</div>
        <div class="pill">due ${fmtDate(p.dueAt)}</div>
      </div>
      <div class="row">
        <div class="meta">${p.mediaType}</div>
        <div class="meta">${p.status.replaceAll("_"," ")}</div>
      </div>
    `;
    el.addEventListener("click", () => {
      selectedProjectId = p.id;
      render();
    });
    listEl.appendChild(el);
  });

  renderProjectDetails();
}

function renderProjectDetails(){
  const el = $("#projDetails");
  const p = state.projects.find(x => x.id === selectedProjectId);

  if(!p){
    el.innerHTML = `<div class="hint">Select a project to see details.</div>`;
    return;
  }

  // Step 1: Show only the button to copy prompt and open Copilot
  if(p.detailsStep === "awaiting_prompt_action"){
    el.innerHTML = `
      <div class="kv">
        <div class="k">Project</div><div class="v"><b>${p.mediaType}</b> for <span class="v mono">${p.sender}</span></div>
        <div class="k">Due</div><div class="v">${fmtDate(p.dueAt)}</div>
        <div class="k">Status</div><div class="v">${p.status.replaceAll("_"," ")}</div>
      </div>

      <div class="actions">
        <button class="btn" id="copyPromptBtn" style="width:100%;justify-content:center;">Copy Prompt & Open Copilot</button>
      </div>

      <div class="hint">
        Click the button to copy the project brief prompt to your clipboard and open Copilot. Then paste the prompt and generate the detailed brief.
      </div>
    `;
    
    $("#copyPromptBtn").addEventListener("click", () => copyProjectPrompt(p.id));
    return;
  }

  // Step 2: Show text area to paste Copilot response
  if(p.detailsStep === "awaiting_response_paste"){
    el.innerHTML = `
      <div class="kv">
        <div class="k">Project</div><div class="v"><b>${p.mediaType}</b> for <span class="v mono">${p.sender}</span></div>
        <div class="k">Due</div><div class="v">${fmtDate(p.dueAt)}</div>
      </div>

      <div>
        <div class="k" style="margin:10px 0 6px;">Paste Copilot Response (Markdown)</div>
        <textarea id="responseBox" placeholder="Paste the Copilot-generated brief here. It will be converted to HTML format when you save."></textarea>
        <div class="actions" style="margin-top:10px;">
          <button class="btn" id="saveResponseBtn" style="width:100%;justify-content:center;">Save Response</button>
        </div>
      </div>

      <div class="hint">
        Paste the full Copilot response here. When you save, it will be converted from Markdown to HTML format for display.
      </div>
    `;

    $("#responseBox").value = p.responseMarkdown || "";
    $("#saveResponseBtn").addEventListener("click", () => {
      const md = $("#responseBox").value.trim();
      if(!md){
        toast("Response cannot be empty.");
        return;
      }
      saveProjectResponse(p.id, md);
      render();
    });
    return;
  }

  // Step 3: Show the converted HTML response
  if(p.detailsStep === "done"){
    el.innerHTML = `
      <div class="kv">
        <div class="k">Project</div><div class="v"><b>${p.mediaType}</b> for <span class="v mono">${p.sender}</span></div>
        <div class="k">Due</div><div class="v">${fmtDate(p.dueAt)}</div>
        <div class="k">Status</div><div class="v">${p.status.replaceAll("_"," ")}</div>
      </div>

      <div class="actions">
        <button class="btn secondary small" id="editResponseBtn">✏️ Edit Response</button>
        <button class="btn secondary small" id="printResponseBtn">🖨️ Print</button>
        <button class="btn secondary small" id="markDoneBtn">✅ Mark Done</button>
      </div>

      <div style="margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.02);overflow-x:auto;">
        <div id="responseHtmlDisplay"></div>
      </div>

      <div class="hint">
        Your project details have been saved. Click "Edit Response" to make changes.
      </div>
    `;

    // Render the HTML content
    const htmlDisplay = $("#responseHtmlDisplay");
    htmlDisplay.innerHTML = p.responseHtml || "";

    // Add click handlers
    $("#editResponseBtn").addEventListener("click", () => {
      p.detailsStep = "awaiting_response_paste";
      saveState(state);
      render();
    });

    $("#printResponseBtn").addEventListener("click", () => {
      printProjectResponse(p);
    });

    $("#markDoneBtn").addEventListener("click", () => {
      p.status = "done";
      saveState(state);
      toast("Project marked done.");
      render();
    });
    return;
  }
}

function escapeHtml(str){
  return (str || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function printProjectResponse(p){
  // Create a print-friendly window with the response content
  const printWindow = window.open("", "", "width=900,height=800");
  const htmlContent = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width,initial-scale=1" />
      <title>Print - ${escapeHtml(p.mediaType)} for ${escapeHtml(p.sender)}</title>
      <style>
        :root {
          --text: #0b1220;
          --line: #e3e7f5;
          --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
          --sans: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
          --accent: #4f46e5;
          --accent2: #16a34a;
          --muted: #4b5a7a;
        }
        body {
          font-family: var(--sans);
          color: var(--text);
          background: white;
          margin: 0;
          padding: 40px;
          line-height: 1.6;
        }
        .print-header {
          margin-bottom: 30px;
          border-bottom: 2px solid var(--line);
          padding-bottom: 20px;
        }
        .print-header h1 {
          margin: 0;
          font-size: 24px;
          color: var(--text);
        }
        .print-header .details {
          margin-top: 10px;
          font-size: 14px;
          color: var(--muted);
        }
        .print-header .detail-item {
          display: inline-block;
          margin-right: 20px;
        }
        .print-content {
          margin-top: 20px;
        }
        h1, h2, h3, h4, h5, h6 {
          margin: 24px 0 12px 0;
          color: var(--text);
          line-height: 1.3;
        }
        h1 { font-size: 28px; font-weight: 800; }
        h2 { font-size: 22px; font-weight: 700; }
        h3 { font-size: 18px; font-weight: 700; }
        h4, h5, h6 { font-size: 16px; font-weight: 650; }
        p { margin: 12px 0; }
        ul, ol {
          margin: 12px 0 12px 20px;
        }
        li { margin: 6px 0; }
        code {
          font-family: var(--mono);
          background: #f5f7ff;
          color: var(--accent);
          padding: 2px 6px;
          border-radius: 4px;
          font-size: 13px;
        }
        pre {
          background: #f5f7ff;
          border: 1px solid var(--line);
          border-radius: 6px;
          padding: 12px;
          margin: 12px 0;
          overflow-x: auto;
        }
        pre code {
          background: none;
          color: var(--text);
          padding: 0;
          border-radius: 0;
          font-size: 12px;
        }
        blockquote {
          border-left: 3px solid var(--accent);
          margin: 12px 0;
          padding-left: 12px;
          color: var(--muted);
          font-style: italic;
        }
        a {
          color: var(--accent);
          text-decoration: underline;
        }
        table {
          border-collapse: collapse;
          width: 100%;
          margin: 12px 0;
        }
        table th, table td {
          border: 1px solid var(--line);
          padding: 8px 12px;
          text-align: left;
        }
        table th {
          background: #f5f7ff;
          font-weight: 650;
        }
        @media print {
          body { margin: 0; padding: 20px; }
          .print-header { border-bottom: 1px solid var(--line); padding-bottom: 15px; }
          h1, h2, h3, h4, h5, h6 { page-break-after: avoid; }
          blockquote, pre { page-break-inside: avoid; }
          table { page-break-inside: avoid; }
        }
      </style>
    </head>
    <body>
      <div class="print-header">
        <h1>${escapeHtml(p.mediaType)}</h1>
        <div class="details">
          <div class="detail-item"><strong>For:</strong> ${escapeHtml(p.sender)}</div>
          <div class="detail-item"><strong>Due:</strong> ${fmtDate(p.dueAt)}</div>
          <div class="detail-item"><strong>Printed:</strong> ${new Date().toLocaleString()}</div>
        </div>
      </div>
      <div class="print-content">
        ${p.responseHtml}
      </div>
    </body>
    </html>
  `;
  printWindow.document.write(htmlContent);
  printWindow.document.close();
  
  // Wait for content to load before printing
  setTimeout(() => {
    printWindow.focus();
    printWindow.print();
  }, 250);
}

/* ---------- Calendar tab ---------- */
function renderCalendar(root){
  // month cursor -> first day
  const year = calCursor.getFullYear();
  const month = calCursor.getMonth();

  const first = new Date(year, month, 1);
  const startDow = first.getDay(); // 0 Sun
  const daysInMonth = new Date(year, month+1, 0).getDate();

  // show a 6-week grid
  const gridStart = new Date(year, month, 1 - startDow);
  const monthName = first.toLocaleDateString(undefined, { month:"long", year:"numeric" });

  // Build map of due dates -> projects
  const dueMap = new Map();
  state.projects.forEach(p => {
    const d = new Date(p.dueAt);
    const key = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    if(!dueMap.has(key)) dueMap.set(key, []);
    dueMap.get(key).push(p);
  });

  root.innerHTML = `
    <div class="calendar">
      <div class="cal-head">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button class="btn secondary small" id="prevMonth">←</button>
          <div class="month">${monthName}</div>
          <button class="btn secondary small" id="nextMonth">→</button>
          <button class="btn secondary small" id="todayBtn">Today</button>
        </div>
        <div class="meta">Due dates from accepted projects</div>
      </div>

      <div class="cal-grid" id="calGrid"></div>

      <div class="drawer" id="dayDrawer" style="display:none;"></div>

      <div class="hint">
        Calendar shows projects by due date. Accept more requests to populate it.
      </div>
    </div>
  `;

  $("#prevMonth").addEventListener("click", () => { calCursor = new Date(year, month-1, 1); calSelectedDay = null; render(); });
  $("#nextMonth").addEventListener("click", () => { calCursor = new Date(year, month+1, 1); calSelectedDay = null; render(); });
  $("#todayBtn").addEventListener("click", () => { calCursor = new Date(); calSelectedDay = null; render(); });

  const grid = $("#calGrid");
  const dows = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  dows.forEach(d => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  for(let i=0;i<42;i++){
    const day = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
    const isThisMonth = day.getMonth() === month;
    const key = new Date(day.getFullYear(), day.getMonth(), day.getDate()).getTime();
    const projectsDue = dueMap.get(key) || [];

    const cell = document.createElement("div");
    cell.className = "day" + (isThisMonth ? "" : " muted");

    const countPill = projectsDue.length ? `<span class="pill">${projectsDue.length}</span>` : `<span></span>`;
    cell.innerHTML = `
      <div class="daynum">
        <span>${day.getDate()}</span>
        ${countPill}
      </div>
      <div class="marks">
        ${projectsDue.slice(0,2).map(p => `<div class="mark">${escapeHtml(p.sender)} • ${escapeHtml(shorten(p.mediaType, 20))}</div>`).join("")}
        ${projectsDue.length > 2 ? `<div class="meta">+${projectsDue.length-2} more</div>` : ``}
      </div>
    `;

    cell.addEventListener("click", () => {
      calSelectedDay = key;
      renderDayDrawer(key, projectsDue);
    });

    grid.appendChild(cell);
  }

  // restore drawer if selected
  if(calSelectedDay){
    const list = dueMap.get(calSelectedDay) || [];
    renderDayDrawer(calSelectedDay, list);
  }
}

function shorten(s, n){
  s = s || "";
  return s.length > n ? s.slice(0, n-1) + "…" : s;
}

function renderDayDrawer(dayKey, projects){
  const drawer = $("#dayDrawer");
  const d = new Date(dayKey);
  drawer.style.display = "block";
  drawer.innerHTML = `
    <h3>${d.toLocaleDateString(undefined, { weekday:"long", year:"numeric", month:"long", day:"numeric" })}</h3>
    ${projects.length ? projects.map(p => `
      <div class="p">
        <div class="row">
          <div class="sender">${escapeHtml(p.sender)}</div>
          <div class="pill">${escapeHtml(p.status.replaceAll("_"," "))}</div>
        </div>
        <div class="meta" style="margin-top:6px;">${escapeHtml(p.mediaType)}</div>
        <div class="actions" style="margin-top:10px;">
          <button class="btn secondary small" data-openproj="${p.id}">Open Project</button>
          ${p.copilotChatUrl ? `<a class="btn small" style="text-decoration:none;" href="${escapeHtml(p.copilotChatUrl)}" target="_blank" rel="noreferrer">↗ Open Saved Chat</a>` : ""}
        </div>
      </div>
    `).join("") : `<div class="hint">No projects due on this day.</div>`}
  `;

  drawer.querySelectorAll("[data-openproj]").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedProjectId = btn.getAttribute("data-openproj");
      currentTab = "projects";
      $$(".tab").forEach(x => x.classList.toggle("active", x.dataset.tab === currentTab));
      render();
    });
  });
}

/* ---------- initial render ---------- */
render();
</script>
